name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:

  lint:
    name: "Linter (ruff)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install ruff"
        run: pip install --disable-pip-version-check "ruff==0.17.5"

      - name: "ruff check"
        run: ruff check . --output-format=github

      - name: "ruff format --check"
        run: ruff format --check --diff .

  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "Run tests"
        run: python -m pytest test_forgejo_pr_llm.py -v --tb=short

  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: "Lint Dockerfile (hadolint)"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: "Build image"
        run: |
          docker build \
            --tag forgejo-pr-llm:ci \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

      - name: "Smoke-test: CLI responds"
        run: |
          docker run --rm forgejo-pr-llm:ci --version
          docker run --rm forgejo-pr-llm:ci --help

      - name: "Smoke-test: config error exits with code 2"
        run: |
          set +e
          docker run --rm forgejo-pr-llm:ci \
            https://forgejo.example.com/owner/repo \
            --llm-url http://localhost:11434/v1/chat/completions \
            --model test --prompt-file /nonexistent.txt
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

      - name: "Verify container runs as non-root"
        run: |
          user=$(docker run --rm --entrypoint id forgejo-pr-llm:ci -un)
          echo "user in container: $user"
          test "$user" != "root"

      - name: "Show image size"
        run: docker image ls forgejo-pr-llm:ci
